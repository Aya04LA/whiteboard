events {}

http {
  # WebSockets need the Upgrade handshake passed through, and long-lived reads.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # No sticky sessions needed: any instance can serve any room, because
  # instances share room traffic over Redis pub/sub.
  upstream canvas {
    server app:8000;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://canvas;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 1h;
    }
  }
}
