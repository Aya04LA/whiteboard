# Two app instances behind nginx sharing one Redis (op log + pub/sub).
# Open the same board twice and you'll likely be on different instances,
# yet you see each other's strokes and cursors live.
#
#   docker compose up --build    then open http://localhost:8080
services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 10

  app:
    build: .
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis: { condition: service_healthy }
    deploy:
      replicas: 2

  lb:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
